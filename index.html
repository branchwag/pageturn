<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rustic Journal</title>
    <link data-trunk rel="rust" data-wasm-opt="2"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #4a3f35 0%, #5a4f45 100%);
        }
        
        canvas {
            width: 100%;
            height: 100%;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Georgia, serif;
            font-size: 24px;
            color: #f5ebd2;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Loading journal...</div>
    <canvas id="the_canvas_id"></canvas>
</body>
</html>
